# Model registry for Legend Mode.
#
# Each entry is resolved to a local .gguf by, in order:
#   1. `glob` patterns, searched under the HF cache and ./models
#   2. `hf download <repo> <file>` if nothing matched and `auto_download` is true
#
# `alias` becomes the Ollama tag `legend/<alias>`.
# `keep_alive` is passed per request: -1 pins the model in RAM forever, "5m" lets
# Ollama evict it after five idle minutes. Only the pinned tier survives eviction.
#
# temperature/top_p/top_k/repeat_penalty are per-tier sampling defaults (see
# ModelSpec.sampling_defaults in app/config.py) — None/omitted leaves Ollama's own
# default in place, and a caller-supplied temperature/top_p in the API request
# always overrides whatever's set here. The shared system prompt (identity, not
# sampling) lives in app/persona.py, not here.
#
# Current layout — three answering models. Everything else is parked.
#   general (350M, pinned)  -> trivial replies + stage-3 classifier
#   embed (pinned)          -> routing only, never answers
#   instruct-q3 (1.2B)      -> ordinary conversation; see the measurement in routes.yaml
#   think (LFM2.5-1.2B)     -> reasoning, and the only tier that can verify an answer
#
# Why verification sits on the 1.2B. Measured over 16 question/answer pairs (8 right,
# 8 wrong), asking each model to judge correctness:
#
#   350M                 50% accurate, rubber-stamped 8/8 wrong answers, 0.6s
#   Qwen3.5-0.8B (fast)  56% accurate, rubber-stamped 7/8 wrong answers, 1.1s
#   Qwen3.5-0.8B (think) 100% on the 6/16 it finished, ran out of budget on 10, 28s
#   LFM2.5-1.2B          100% on the 14/16 it finished, 0 false alarms,        28s
#
# So verification is the 1.2B's job and cannot be delegated downward: no smaller model
# here can tell a right answer from a wrong one. That leaves the second model with only
# cheap latency-critical work (trivial replies, stage-3 classification), where the 350M
# wins outright — 71.8 tok/s vs the 0.8B's 39, at 229 MB vs 737 MB. The 230M was tried
# for that role earlier and was measurably worse than the 350M, so general fills it,
# per Settings.router_alias in app/config.py.

defaults:
  num_ctx: 8192
  auto_download: true

models:
  # --- Pinned tier: always resident, ~290 MB combined ---

  - alias: general
    tier: general
    repo: LiquidAI/LFM2.5-350M-GGUF
    file: LFM2.5-350M-Q4_K_M.gguf
    glob:
      - "**/LFM2.5-350M*Q4_K_M.gguf"
    keep_alive: -1
    num_ctx: 4096
    # Not an Unsloth build: Unsloth publishes no LFM2.5-350M, only upstream LiquidAI.
    # Originally pulled straight through `ollama pull liquidai/lfm2.5-350m:q4_k_m` and
    # tagged in with `ollama cp`, so re-running import_models.py will find the tag
    # already present and skip it; the repo/file above are here so a from-scratch
    # machine can still resolve and import it normally.
    # Serves two roles: trivial replies and stage-3 classification (see
    # Settings.router_alias) — kept moderate rather than tuned purely for one of
    # them. Everyday chat moved to the instruct tier; see routes.yaml. (The
    # stage-3 classifier call in
    # app/router/classifier.py hardcodes its own temperature: 0.0 regardless of
    # this — this only affects the user-facing replies it generates directly.)
    # Short system prompt: at 350M a long instruction block competes with the actual
    # question, and this tier kept volunteering name-talk in unrelated replies. The
    # exact wording is measured, not guessed — read the notes in app/persona.py before
    # editing either prompt.
    persona: brief
    temperature: 0.6
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1

  - alias: embed
    tier: embed
    repo: unsloth/bge-small-en-v1.5-GGUF
    file: bge-small-en-v1.5-f16.gguf
    glob:
      - "**/bge-small-en-v1.5*.gguf"
    keep_alive: -1
    num_ctx: 512
    embedding: true

  # --- Swapped tier: at most one resident at a time ---

  - alias: think
    tier: think
    repo: unsloth/LFM2.5-1.2B-Thinking-GGUF
    file: LFM2.5-1.2B-Thinking-Q4_K_M.gguf
    glob:
      - "**/LFM2.5-1.2B-Thinking-Q4_K_M.gguf"
    keep_alive: 5m
    thinking: true
    # Needs headroom for the <think> block plus the actual answer.
    default_max_tokens: 1536
    # Reasoning benefits from a little room to explore an approach before
    # committing, but still needs to converge — moderate temperature, not low.
    temperature: 0.6
    top_p: 0.95
    top_k: 40
    repeat_penalty: 1.1

  # Candidate replacement for the 350M's *chat* role — not its classifier role, where
  # 71.8 tok/s is the whole point and quality barely matters.
  #
  # The 350M's conversational failures are not prompt-fixable. Replaying one real
  # transcript it invented a maker outright ("developed by NLP research team at Stanford
  # University"), answered "what am I?" with "You're asking about myself", and echoed
  # "Nope" back twice in a row. That is a capability floor, not a wording problem.
  #
  # This is the *Instruct* build, deliberately, not the Thinking one with reasoning
  # turned off — Ollama advertises a `thinking` capability for the Thinking GGUF but
  # `think: false` does not actually suppress the block, verified against the daemon. A
  # model trained to reason first is not the same thing as one trained to answer first.
  #
  # The comparison has since run and `chat` routes to the 3-bit build below, not to this
  # one. Kept registered so the Q4-vs-UD-Q3 measurement in routes.yaml can be re-run;
  # reachable with an explicit {"model": "instruct"}.
  - alias: instruct
    tier: instruct
    repo: unsloth/LFM2.5-1.2B-Instruct-GGUF
    file: LFM2.5-1.2B-Instruct-Q4_K_M.gguf
    glob:
      - "**/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
    keep_alive: 5m
    default_max_tokens: 512
    temperature: 0.6
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1

  # Temporary, for a quantisation comparison — remove once it is settled. Unsloth's
  # *dynamic* 3-bit rather than a plain Q3_K_M: UD quants keep more precision in the
  # layers that matter, which is the only version of 3-bit worth considering on a tier
  # that was adopted for answer quality in the first place.
  #
  # 600 MB against Q4_K_M's 731 MB. The hoped-for win is throughput, since CPU decode is
  # memory-bandwidth bound — but the measured bottleneck on this machine is sustained-load
  # throttling, not bandwidth, so the honest prior is that it buys little. Being tested
  # interleaved with Q4 for exactly that reason.
  - alias: instruct-q3
    tier: instruct
    repo: unsloth/LFM2.5-1.2B-Instruct-GGUF
    file: LFM2.5-1.2B-Instruct-UD-Q3_K_XL.gguf
    glob:
      - "**/LFM2.5-1.2B-Instruct-UD-Q3_K_XL.gguf"
    keep_alive: 5m
    default_max_tokens: 512
    temperature: 0.6
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1

  # --- A 4B was tried as a replacement for the chat tier, and rejected. ---------
  #
  # Measured 2026-08-14 against Qwen3.5-4B at two quant levels, both registered
  # temporarily and pinned with `scripts/eval.py --model` so all three answered identical
  # cases with routing held constant. 19 cases (computable, dispute, factual), 2 samples.
  #
  #                    instruct-q3   qwen4b-q3   qwen4b-q2
  #   on disk               600 MB      2.4 GB      1.9 GB
  #   computable               94%        100%        100%
  #   dispute                  12%         12%         12%
  #   factual                 100%        100%         50%
  #   OVERALL                  61%         63%         58%
  #   latency median          3.4 s      19.3 s      21.1 s
  #   latency p90             7.9 s      91.8 s      77.5 s
  #   latency max            17.7 s     411.0 s     293.6 s
  #   grounding fixes      2 (12%)           0           0
  #
  # **+2 points for 5.8x the median latency, and a p90 of 92 s against 7.9 s.** Q2 is
  # strictly worse than the 1.2B on accuracy *and* slower, so it has no argument at all;
  # it was also no faster than Q3 warm (5.9 s vs 5.2 s per 12 tokens), because cheaper
  # weights are offset by costlier dequantisation on CPU. Both weights were deleted.
  #
  # **The useful result is `dispute`: 12% for all three.** That is the "push back on a
  # false premise rather than invent" category, and the weakness behind the open web
  # grounding problem. Four times the parameters moved it by nothing. It is a routing and
  # prompting problem, not a parameter-count one — so do not reach for a bigger model
  # next time without a reason more specific than size.
  #
  # The 4B's genuine wins were real and small: computable 94% -> 100%, and 0 arithmetic
  # corrections against the 1.2B's 2.
  #
  # Gemma-4-E4B was rejected before download. "E4B" is *effective* parameters — the
  # weights read per token are the full ~8B — so its smallest published quant (QAT
  # UD-Q2_K_XL, 3.22 GB) is 1.7x Qwen's 1.94 GB, and CPU decode here is bandwidth bound.
  # It would have paid double Qwen's latency, and Qwen's was already too slow.
  #
  # To redo any of this: `hf download unsloth/Qwen3.5-4B-GGUF <file>` needs
  # HF_HUB_DISABLE_XET=1 on this machine — the Xet backend stalled at 11 MB with the
  # process alive and zero throughput, and left no error anywhere.

  # --- Parked. Weights stay on disk (and `legend/small` is still tagged in Ollama),
  # so uncommenting an entry and re-running scripts/import_models.py brings it back.
  # Anything restored here also needs its route re-added to routes.yaml, which no
  # longer defines `tools` or `vision`.
  #
  # Qwen3.5-0.8B: the previous tools/vision tier. Dropped because image support isn't
  # wanted right now and it lost the second-model comparison at the top of this file.
  # It is also the tier that insists it is Qwen no matter the system prompt, which is
  # why app/router/rules.py still pins identity questions away from it.
  #
  # - alias: small
  #   tier: small
  #   repo: unsloth/Qwen3.5-0.8B-GGUF
  #   file: Qwen3.5-0.8B-Q4_K_M.gguf
  #   glob:
  #     - "**/Qwen3.5-0.8B-Q4_K_M.gguf"
