  #   tools: true
  #   # Every Qwen3.5 GGUF here defaults to thinking ON and will burn the whole token
  #   # budget on a <think> block, returning empty content, unless this is set.
  #   default_think: false
  #   temperature: 0.3
  #   top_p: 0.85
  #   top_k: 30
  #   repeat_penalty: 1.15
  #
  # - alias: large
  #   tier: large
  #   repo: unsloth/Qwen3.5-2B-GGUF
  #   file: Qwen3.5-2B-Q4_K_M.gguf
  #   glob:
  #     - "**/Qwen3.5-2B-Q4_K_M.gguf"
  #   mmproj_glob:
  #     - "**/models--unsloth--Qwen3.5-2B-GGUF/**/mmproj-F16.gguf"
  #   mmproj_file: mmproj-F16.gguf
  #   keep_alive: 2m
  #   tools: true
  #   vision: true
  #   default_think: false
  #
  # - alias: large
  #   tier: large
  #   repo: unsloth/Qwen3.5-4B-GGUF
  #   file: Qwen3.5-4B-Q4_K_M.gguf
