name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Lets a broken build be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A new push to a PR makes the previous run's result irrelevant. Cancel it rather than
# paying for both -- except on the default branch, where each commit's status is a
# record worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing is worth knowing about even if another already failed.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact tag, not a floating major: setup-uv publishes v9.0.0 but
        # no `v9` alias, so `@v9` fails to resolve at job setup.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.26"
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock has drifted from pyproject.toml, so a dependency
        # edit that forgot to relock is caught here rather than in a container build.
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        # Rules are pinned in pyproject.toml. `ruff format --check` is deliberately not
        # run: this codebase is hand-formatted, and adopting a formatter is a decision
        # with a 37-file diff attached rather than something CI should start demanding.
        run: uv run ruff check .

      - name: Test
        # The router cascade tests run against a stub backend -- no Ollama, no model
        # loads, no network. That is what makes this suite runnable in CI at all.
        run: uv run pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Built and thrown away. There is no registry to push to yet, and the point
          # is to catch a Dockerfile that stopped building, which is otherwise only
          # discovered by whoever next tries to deploy.
          push: false
          load: true
          tags: legend-mode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # A image that builds but cannot import its own app is still broken. This
        # catches a missing dependency or a bad COPY without needing Ollama: importing
        # app.main builds the FastAPI object without running the lifespan handler.
        run: docker run --rm legend-mode:ci python -c "import app.main; print('import ok')"
