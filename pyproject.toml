[project]
name = "legend-mode"
version = "0.1.0"
description = "Local model router: picks the right small model per request, hot-swapped via Ollama."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krishkumar Patel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "huggingface-hub>=0.26",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Width matches how this codebase is actually written: only 46 of its lines exceed 96
# characters, against 605 that exceed ruff's default 88. The comment blocks in
# app/config.py carry measurements in prose, and reflowing them to 88 would shred them.
#
# Note that CI lints but does not run `ruff format --check`. The code is hand-formatted,
# and `ruff format` would rewrite 37+ files — adopting a formatter is a real decision
# with a large diff attached, not a thing to smuggle in with a licence change.
[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly rather than left to ruff's defaults, because "whatever the installed
# ruff selects" is not a thing CI can reproduce: upgrading ruff would otherwise turn a
# green build red without a single line of this project changing.
#
# Scope is deliberately correctness-and-consistency, not style opinion. SIM/BLE/TRY are
# left out: they propose refactors (collapse nested ifs, narrow blind excepts) that are
# judgement calls about code this project deliberately wrote the way it did.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF100"]

[tool.uv]
package = false
