<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legend Mode</title>
<style>
/* ============================================================================
   Legend Mode console.

   An instrument, not a chat app that happens to log things. The router makes a
   decision per request across five stages, picks an effort level, maybe grounds,
   retrieves, calls a tool or adjudicates — and none of that is visible anywhere
   else. The trace panel is the point; the chat is how you feed it.

   The tool row follows the same rule as the rest of the panel: it appears only
   when something happened. `meta.tools` is absent unless the gate opened, and
   the gate declining is the common and correct case, so a permanent "no tools"
   line would be noise that trains the eye to skip that part of the panel.

   One file, no build step, no dependencies. It is served straight out of
   app/static by the same process that answers the requests, which means there is
   nothing to start, nothing to keep in sync, and it works with the network off.

   Two things about this palette are functional rather than decorative:
     - Route colour is meaning, not garnish. trivial / chat / think keep the same
       hue everywhere they appear, so the history feed is scannable at a glance.
     - Amber on near-black holds up at the contrast ratios this needs, and it is
       the one accent that reads as "instrument" rather than "notification".
   ============================================================================ */

:root {
  --bg:         #0a0706;
  --bg-raise:   #120d09;
  --panel:      #150f0a;
  --panel-2:    #1c140d;
  --line:       #2e2118;
  --line-hot:   #4a3117;

  --amber:      #ff8a1e;
  --amber-hi:   #ffb057;
  --amber-dim:  #b35f0f;
  --amber-ghost:rgba(255,138,30,0.10);

  --text:       #f2e6da;
  --text-2:     #c8b39c;
  --text-mute:  #8a7663;

  --ok:         #6fbf73;
  --warn:       #e8b04b;
  --bad:        #e0603f;

  --route-trivial: #8a7663;
  --route-chat:    #ffb057;
  --route-think:   #ff6a1e;

  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --sans: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--sans);
  overflow: hidden;
  /* Mobile browsers change viewport height as the URL bar hides, so `100%` leaves the
     composer under the chrome or scrolls the whole page. `dvh` tracks the real height;
     the `100%` line above stays as the fallback for anything that lacks it. */
  height: 100dvh;
  /* iOS zooms the page when a focused input is under 16px. Set here so the rule is in
     one place — the textarea inherits it. */
  -webkit-text-size-adjust: 100%;
}

/* Faint grid + scanlines. Low enough to read as texture, never as pattern. */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    linear-gradient(rgba(255,138,30,0.030) 1px, transparent 1px) 0 0 / 100% 3px,
    linear-gradient(90deg, rgba(255,138,30,0.020) 1px, transparent 1px) 0 0 / 46px 100%,
    linear-gradient(rgba(255,138,30,0.020) 1px, transparent 1px) 0 0 / 100% 46px,
    radial-gradient(1100px 520px at 12% -12%, rgba(255,106,30,0.10), transparent 70%),
    radial-gradient(900px 460px at 105% 8%, rgba(255,138,30,0.06), transparent 70%);
}

/* ---------- shell ---------- */

#app {
  position: relative; z-index: 1;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-columns: minmax(0, 1fr) 372px;
  grid-template-areas: "hd hd" "main side";
}

/* ---------- header ---------- */

header {
  grid-area: hd;
  display: flex; align-items: center; gap: 18px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,138,30,0.05), transparent);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.reticle { width: 30px; height: 30px; flex: none; }
.reticle .spin  { transform-origin: 50% 50%; animation: spin 9s linear infinite; }
.reticle .spin2 { transform-origin: 50% 50%; animation: spin 6s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

.wordmark {
  font-family: var(--mono);
  font-size: 15px; font-weight: 600;
  letter-spacing: 0.30em;
  color: var(--amber-hi);
  text-shadow: 0 0 18px rgba(255,138,30,0.35);
  white-space: nowrap;
}
.tagline {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em;
  color: var(--text-mute); text-transform: uppercase; white-space: nowrap;
}

.status { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 4px 9px;
  border: 1px solid var(--line-hot);
  color: var(--text-2);
  background: var(--amber-ghost);
  white-space: nowrap;
}
.pill b { color: var(--amber-hi); font-weight: 600; }
.pill.down { border-color: #5a2a1c; color: var(--bad); background: rgba(224,96,63,0.08); }

/* ---------- panels ---------- */

.panel { position: relative; background: var(--panel); border: 1px solid var(--line); }
/* Corner brackets — the one piece of pure decoration, kept to 1px so it reads as
   a machined edge rather than a frame. */
.panel::before, .panel::after {
  content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none;
  border-color: var(--amber-dim); border-style: solid; border-width: 0;
}
.panel::before { top: -1px; left: -1px;  border-top-width: 1px; border-left-width: 1px; }
.panel::after  { bottom: -1px; right: -1px; border-bottom-width: 1px; border-right-width: 1px; }

.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.17em;
  text-transform: uppercase; color: var(--amber);
}
.panel-head .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-hot), transparent); }
.panel-head .count { color: var(--text-mute); letter-spacing: 0.08em; }

/* A collapsible section header. The caret is the affordance, so the whole strip is the
   hit target rather than a small button. */
.panel-head.toggle { cursor: pointer; user-select: none; }
.panel-head.toggle:hover { color: var(--amber-hi); }
.caret {
  font-size: 9px; line-height: 1; color: var(--amber-dim);
  transition: transform .15s ease-out; transform-origin: 50% 50%;
}
.side-sec.collapsed .caret { transform: rotate(-90deg); }
.side-sec.collapsed .side-body { display: none; }

/* --- memory --- */
.mem-row {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
  padding: 7px 0; border-bottom: 1px solid rgba(46,33,24,0.6);
}
.mem-row .fact { font-size: 12px; color: var(--text-2); line-height: 1.45; word-break: break-word; }
.mem-row .key {
  display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--amber-dim); margin-bottom: 2px;
}
.mem-row button {
  font-family: var(--mono); font-size: 10px; line-height: 1;
  background: none; border: 1px solid var(--line); color: var(--text-mute);
  padding: 3px 6px; cursor: pointer;
}
.mem-row button:hover { border-color: var(--bad); color: var(--bad); }
.chip.remembered { color: var(--amber-hi); border-color: var(--amber-dim); }
.chip.tools { color: var(--amber-hi); border-color: var(--amber-dim); }

/* ---------- main / chat ---------- */

main {
  grid-area: main;
  display: grid; grid-template-rows: minmax(0,1fr) auto;
  min-width: 0; min-height: 0;
}

#log {
  overflow-y: auto;
  padding: 22px 26px 8px;
  display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth;
}

.msg { display: flex; flex-direction: column; max-width: 78%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; }

.msg .who {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-mute); margin-bottom: 5px;
}
.msg .body {
  padding: 11px 14px;
  border: 1px solid var(--line);
  background: var(--bg-raise);
  white-space: pre-wrap; word-wrap: break-word;
}
.msg.user .body { border-color: var(--line-hot); background: rgba(255,138,30,0.07); }
.msg.bot .body  { border-left: 2px solid var(--tier, var(--amber-dim)); }

.msg .foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--text-mute);
}
.msg .foot button {
  font: inherit; letter-spacing: inherit;
  background: none; border: 1px solid var(--line); color: var(--text-mute);
  padding: 2px 7px; cursor: pointer;
}
.msg .foot button:hover { border-color: var(--amber-dim); color: var(--amber-hi); }
.msg.selected .body { box-shadow: -3px 0 0 -1px var(--amber); }

.tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 1px 6px;
  border: 1px solid currentColor; opacity: 0.9;
}
.tag.trivial { color: var(--route-trivial); }
.tag.chat    { color: var(--route-chat); }
.tag.think   { color: var(--route-think); }

.err { color: var(--bad); border-color: #5a2a1c !important; }

/* thinking indicator */
.working { display: flex; align-items: center; gap: 10px; color: var(--amber); font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; }
.working .bars { display: inline-flex; gap: 3px; }
.working .bars i { width: 3px; height: 13px; background: var(--amber); animation: pulse 1.05s ease-in-out infinite; }
.working .bars i:nth-child(2) { animation-delay: .13s; }
.working .bars i:nth-child(3) { animation-delay: .26s; }
.working .bars i:nth-child(4) { animation-delay: .39s; }
@keyframes pulse { 0%,100% { transform: scaleY(0.35); opacity: .45; } 50% { transform: scaleY(1); opacity: 1; } }

/* ---------- composer ---------- */

#composer { border-top: 1px solid var(--line); padding: 12px 26px 16px; background: linear-gradient(0deg, rgba(255,138,30,0.04), transparent); }
.controls { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
label.ctl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-mute); display: flex; align-items: center; gap: 6px; }
select, textarea, button {
  font-family: var(--mono); background: var(--bg-raise); color: var(--text);
  border: 1px solid var(--line); border-radius: 0;
}
select { font-size: 11px; padding: 4px 6px; }
select:focus, textarea:focus { outline: none; border-color: var(--amber-dim); }
.row { display: flex; gap: 10px; align-items: stretch; }
textarea {
  flex: 1; resize: none; padding: 10px 12px; font-size: 13.5px; font-family: var(--sans);
  min-height: 46px; max-height: 190px; line-height: 1.5;
}
button.act {
  padding: 0 20px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  cursor: pointer; background: var(--amber-ghost); border-color: var(--line-hot); color: var(--amber-hi);
  transition: background .12s, border-color .12s;
}
button.act:hover:not(:disabled) { background: rgba(255,138,30,0.20); border-color: var(--amber); }
button.act:disabled { opacity: .38; cursor: default; }
button.ghost { padding: 0 13px; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; color: var(--text-mute); }
button.ghost:hover { color: var(--amber-hi); border-color: var(--amber-dim); }

/* ---------- side ---------- */

/* Flex rather than grid: with three sections, two of which collapse, a row template
   would need rewriting every time one is toggled. The trace grows; the collapsible
   panels take their content up to a cap and scroll inside it. */
aside {
  grid-area: side;
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  min-height: 0; background: var(--bg);
}
.side-sec { display: flex; flex-direction: column; min-height: 0; }
.side-sec.grow { flex: 1 1 auto; }
.side-sec.panelled { flex: 0 1 auto; max-height: 36%; }
.side-sec.panelled.collapsed { flex: 0 0 auto; max-height: none; }
.side-sec + .side-sec { border-top: 1px solid var(--line); }
.side-body { overflow-y: auto; padding: 14px 15px; }

.empty { color: var(--text-mute); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; line-height: 1.7; }

/* cascade rail */
.rail { margin: 0 0 16px; }
.stage {
  display: grid; grid-template-columns: 13px 1fr auto; align-items: center; gap: 9px;
  padding: 4px 0; font-family: var(--mono); font-size: 11px;
  color: var(--text-mute); letter-spacing: 0.07em;
}
.stage .dot { width: 7px; height: 7px; border: 1px solid currentColor; margin-left: 3px; }
.stage.hit { color: var(--amber-hi); }
.stage.hit .dot { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 9px var(--amber); }
.stage.past { color: #6b5a49; }
.stage .verdict { font-size: 10px; opacity: .85; }

.kv { display: grid; grid-template-columns: 84px 1fr; gap: 5px 10px; font-family: var(--mono); font-size: 11px; margin-bottom: 14px; }
.kv dt { color: var(--text-mute); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
.kv dd { margin: 0; color: var(--text-2); word-break: break-word; }
.kv dd.hi { color: var(--amber-hi); }
.kv dd .hi { color: var(--amber-hi); }
.kv dd.bad, .kv dd .bad { color: var(--warn); }

.meter { height: 5px; background: var(--panel-2); border: 1px solid var(--line); margin-top: 5px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
  padding: 3px 8px; border: 1px solid var(--line-hot); color: var(--text-2);
  background: var(--amber-ghost);
}
.chip.on   { color: var(--amber-hi); border-color: var(--amber-dim); }
.chip.warn { color: var(--warn); border-color: #5c4318; }
.chip.off  { color: #6b5a49; border-color: var(--line); background: none; }

.why {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.65;
  color: var(--text-mute); border-left: 1px solid var(--line-hot);
  padding: 2px 0 2px 10px; margin-bottom: 14px;
}

/* history feed */
.feed { display: flex; flex-direction: column; }
.feed-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: baseline;
  padding: 6px 0; border-bottom: 1px solid rgba(46,33,24,0.6);
  font-family: var(--mono); font-size: 10.5px; color: var(--text-mute);
}
.feed-row .prompt { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #33241a; }
::-webkit-scrollbar-thumb:hover { background: var(--line-hot); }

/* The trace belongs beside the chat, not under it — reading a decision means
   looking across at it while the reply is still on screen. An earlier version
   stacked the panel below `main` on narrow windows, which put it off-screen
   exactly when the reply was long enough to be worth tracing.
   So under the breakpoint it becomes a drawer that slides in from the right
   rather than a row that falls underneath. Still on the side, at any width. */
#drawerToggle, #scrim { display: none; }

@media (max-width: 880px) {
  #app {
    height: 100dvh;
    grid-template-columns: minmax(0,1fr);
    grid-template-areas: "hd" "main";
    grid-template-rows: auto minmax(0,1fr);
  }
  aside {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 30;
    width: min(400px, 92vw);
    border-left: 1px solid var(--line-hot);
    box-shadow: -22px 0 44px rgba(0,0,0,0.6);
    transform: translateX(101%);
    transition: transform .18s ease-out;
  }
  aside.open { transform: none; }
  /* A tap anywhere outside closes it. Without this the only way out is the small
     header button, which is a poor target on a phone. */
  #scrim {
    display: block; position: fixed; inset: 0; z-index: 25;
    background: rgba(0,0,0,0.55);
    opacity: 0; pointer-events: none; transition: opacity .18s ease-out;
  }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #drawerToggle { display: block; }

  /* Reclaim width. The tagline and the status pills are desktop affordances; the
     wordmark and the drawer button are what a phone needs. */
  .tagline, .status { display: none; }
  header { padding: 10px 12px; gap: 10px; }
  .wordmark { font-size: 13px; letter-spacing: 0.22em; }
  .reticle { width: 26px; height: 26px; }

  #log { padding: 16px 14px 6px; gap: 14px; }
  .msg { max-width: 94%; }
  #composer { padding: 10px 14px 14px; }

  /* Touch targets, and 16px on the textarea so iOS does not zoom on focus. */
  textarea { font-size: 16px; min-height: 48px; }
  button.act { padding: 0 16px; min-height: 48px; }
  button.ghost, select { min-height: 36px; }
  .msg .foot button { padding: 6px 10px; }
  .mem-row button { padding: 7px 10px; }
}

/* Nothing may push the page sideways. A single overflowing element turns the whole
   layout into a horizontally scrolling desktop page on a phone, which is what this
   console did before the drawer existed. */
@media (max-width: 880px) {
  html, body { overflow-x: hidden; max-width: 100vw; }
  pre, code, table { max-width: 100%; overflow-x: auto; }
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <svg class="reticle" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="17" stroke="#4a3117" stroke-width="1"/>
        <g class="spin">
          <path d="M20 3 a17 17 0 0 1 14.7 8.5" stroke="#ff8a1e" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M20 37 a17 17 0 0 1 -14.7 -8.5" stroke="#ff8a1e" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g class="spin2">
          <circle cx="20" cy="20" r="10.5" stroke="#b35f0f" stroke-width="1" stroke-dasharray="4 6"/>
        </g>
        <circle cx="20" cy="20" r="3.2" fill="#ff8a1e"/>
      </svg>
      <div>
        <div class="wordmark">LEGEND MODE</div>
        <div class="tagline">local router &middot; two models &middot; cpu only</div>
      </div>
    </div>
    <div class="status" id="status"></div>
    <button class="ghost" id="drawerToggle" title="Show the decision trace">trace</button>
  </header>

  <main>
    <div id="log"></div>
    <div id="composer">
      <div class="controls">
        <label class="ctl">effort
          <select id="effort">
            <option value="auto">auto</option>
            <option value="fast">fast</option>
            <option value="standard">standard</option>
            <option value="careful">careful</option>
          </select>
        </label>
        <label class="ctl">model
          <select id="model"><option value="auto">auto</option></select>
        </label>
        <button class="ghost" id="preview" title="Route without generating (GET /route/debug)">preview route</button>
        <button class="ghost" id="reset">new thread</button>
      </div>
      <div class="row">
        <textarea id="input" rows="1" placeholder="Ask something.  Enter sends, Shift+Enter for a new line."></textarea>
        <button class="act" id="send">send</button>
      </div>
    </div>
  </main>

  <div id="scrim"></div>

  <aside>
    <section class="side-sec grow panel" style="border:none">
      <div class="panel-head">decision trace <span class="rule"></span><span class="count" id="traceWhen"></span></div>
      <div class="side-body" id="trace">
        <p class="empty">No decision yet.<br>Send a message, or use <b>preview route</b> to see the cascade resolve without spending a generation.</p>
      </div>
    </section>
    <section class="side-sec panelled" id="memSec">
      <div class="panel-head toggle" id="memToggle" title="What the assistant has been told">
        <span class="caret">&#9660;</span>memory
        <span class="rule"></span><span class="count" id="memCount"></span>
      </div>
      <div class="side-body" id="memory"></div>
    </section>
    <section class="side-sec panelled" id="histSec">
      <div class="panel-head toggle" id="histToggle" title="Show or hide recent requests">
        <span class="caret">&#9660;</span>recent requests
        <span class="rule"></span><span class="count" id="histCount"></span>
      </div>
      <div class="side-body"><div class="feed" id="history"></div></div>
    </section>
  </aside>

</div>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");

/* Conversation state. `messages` is what gets POSTed — full history every turn, so
   follow-ups have real context even though routing only reads the latest turn.
   `traces` holds the x_legend_route for each assistant reply so any message can be
   re-inspected later, not just the most recent one. */
let messages = [];
let traces = [];
let busy = false;

/* ---------- helpers ---------- */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const ms = (n) => n == null ? "—" : n < 1000 ? Math.round(n) + "ms" : (n / 1000).toFixed(1) + "s";

function routeClass(route) {
  return ["trivial", "chat", "think"].includes(route) ? route : "chat";
}

/* ---------- status bar ---------- */

async function refreshStatus() {
  const bits = [];
  try {
    const models = await (await fetch("/v1/models")).json();
    const sel = $("#model");
    const have = new Set([...sel.options].map((o) => o.value));
    for (const m of models.data || []) {
      if (!have.has(m.id)) sel.add(new Option(m.id, m.id));
    }
    bits.push(`<span class="pill">tiers <b>${(models.data || []).length}</b></span>`);
  } catch {
    bits.push('<span class="pill down">server unreachable</span>');
    $("#status").innerHTML = bits.join("");
    return;
  }
  try {
    const r = await (await fetch("/retrieval/status")).json();
    bits.push(r.chunks
      ? `<span class="pill">corpus <b>${r.chunks}</b> chunks &middot; &ge;${r.min_score}</span>`
      : '<span class="pill">corpus <b>empty</b></span>');
  } catch { /* retrieval is optional */ }
  try {
    /* A family whose backend is down still registers its tools, so listing them is not
       enough — the pill goes amber when something is registered but cannot answer.
       Otherwise the first sign of a stopped SearXNG is a slow failure inside a request. */
    const t = await (await fetch("/tools/status")).json();
    if (t.enabled && t.tools.length) {
      const broken = Object.entries(t.health || {}).filter(([, v]) => v !== "ok");
      bits.push(broken.length
        ? `<span class="pill down">tools <b>${t.tools.length}</b> &middot; ${broken.map(([k, v]) => `${k}: ${v}`).join(", ")}</span>`
        : `<span class="pill">tools <b>${t.tools.length}</b> &middot; ${t.families.join(", ")}</span>`);
    }
  } catch { /* tools are optional */ }
  $("#status").innerHTML = bits.join("");
}

/* ---------- history feed ---------- */

/* Collapsed by default and remembered, because the feed is a thing you go and look at
   rather than something worth a permanent third of the sidebar. Polling stops while it
   is hidden — there is no point spending a request every 8 s on a list nobody can see. */
const HIST_KEY = "legendmode.history.collapsed";
let histCollapsed = localStorage.getItem(HIST_KEY) !== "0";

function applyHistCollapsed() {
  $("#histSec").classList.toggle("collapsed", histCollapsed);
}

/* Memory starts open. Unlike the request feed it is small, it changes rarely, and it is
   the one panel the user has to be able to see in order to correct — a wrong fact that
   is invisible is worse than no memory at all, because nothing explains the odd answers.
   Only refetched on demand: memories change when the user states one, not on a timer. */
const MEM_KEY = "legendmode.memory.collapsed";
let memCollapsed = localStorage.getItem(MEM_KEY) === "1";

function applyMemCollapsed() {
  $("#memSec").classList.toggle("collapsed", memCollapsed);
}

async function refreshMemory() {
  try {
    const { enabled, entries } = await (await fetch("/memory")).json();
    $("#memCount").textContent = entries.length ? entries.length : "";
    if (!enabled) {
      $("#memory").innerHTML = '<p class="empty">Memory is off — no corpus database open.</p>';
      return;
    }
    $("#memory").innerHTML = entries.length ? entries.map((e) => `
      <div class="mem-row" data-id="${e.id}">
        <div class="fact">${e.key ? `<span class="key">${esc(e.key)}</span>` : ""}${esc(e.text)}</div>
        <button type="button" title="Forget this">forget</button>
      </div>`).join("")
      : '<p class="empty">Nothing remembered yet.<br>Tell it something — <b>my name is …</b> — or say <b>remember that …</b>.</p>';

    for (const row of document.querySelectorAll(".mem-row")) {
      row.querySelector("button").onclick = async () => {
        await fetch("/memory/" + row.dataset.id, { method: "DELETE" });
        refreshMemory();
      };
    }
  } catch {
    $("#memory").innerHTML = '<p class="empty">Could not read memory.</p>';
  }
}

async function refreshHistory() {
  if (histCollapsed) return;
  try {
    const { entries } = await (await fetch("/route/history?limit=40")).json();
    $("#histCount").textContent = entries.length ? entries.length : "";
    $("#history").innerHTML = entries.length ? entries.map((e) => {
      const d = e.decision || {};
      return `<div class="feed-row">
        <span class="tag ${routeClass(d.route)}">${esc(d.route || "?")}</span>
        <span class="prompt" title="${esc(e.prompt)}">${esc(e.prompt || "")}</span>
        <span>${d.elapsed_ms != null ? ms(d.elapsed_ms) : ""}</span>
      </div>`;
    }).join("") : '<p class="empty">Nothing yet.</p>';
  } catch { /* non-fatal */ }
}

/* ---------- the trace panel ---------- */

/* The cascade, in the order engine.route() actually tries them. Rendering all five
   every time — rather than only the one that fired — is the point: what a decision
   cost is as informative as what it decided. A `rules` hit is free; reaching
   `classifier` means two stages already declined and a 350M guessed. */
const STAGES = [
  ["rules",      "regex signals"],
  ["sticky",     "follow-up"],
  ["cache",      "prompt hash"],
  ["embed",      "bge centroids"],
  ["classifier", "350M label"],
  ["fallback",   "default route"],
];

/* Names of the tools that actually ran, "" when none did. Absent metadata and an empty
   call list mean different things upstream, but both mean "show nothing" here. */
function toolNames(meta) {
  const calls = (meta && meta.tools && meta.tools.calls) || [];
  return calls.map((c) => c.name).join(", ");
}

function renderTrace(meta, whenLabel) {
  if (!meta) return;
  $("#traceWhen").textContent = whenLabel || "";

  const stage = meta.stage;
  const hitAt = STAGES.findIndex(([id]) => id === stage);
  const rail = STAGES.map(([id, desc], i) => {
    const cls = id === stage ? "hit" : (hitAt > -1 && i < hitAt ? "past" : "");
    const verdict = id === stage ? "decided" : (cls === "past" ? "declined" : "");
    return `<div class="stage ${cls}">
      <span class="dot"></span>
      <span>${id}<span style="opacity:.5"> &middot; ${desc}</span></span>
      <span class="verdict">${verdict}</span>
    </div>`;
  }).join("");

  const eff = meta.effort || {};
  const budgetPct = Math.min(100, Math.round(((eff.max_tokens || 0) / 1536) * 100));

  const chips = [];
  chips.push(meta.grounded
    ? `<span class="chip ${/corrected/.test(meta.grounded) ? "warn" : "on"}">grounded &middot; ${esc(meta.grounded)}</span>`
    : '<span class="chip off">no grounding</span>');
  chips.push(meta.followup
    ? `<span class="chip on">follow-up &middot; ${esc(meta.followup)}</span>`
    : '<span class="chip off">new turn</span>');
  if (meta.retrieved && meta.retrieved.length) {
    chips.push(`<span class="chip on">retrieved &middot; ${meta.retrieved.length}</span>`);
  } else if (meta.retrieved) {
    chips.push('<span class="chip off">corpus: no match</span>');
  }
  if (meta.remembered) {
    chips.push(`<span class="chip on">remembered &middot; ${esc(meta.remembered)}</span>`);
  }
  if (meta.adjudicated) {
    const a = meta.adjudicated;
    if (a.skipped) chips.push('<span class="chip warn">no critic available</span>');
    if (a.verdict) chips.push(`<span class="chip ${a.repaired ? "warn" : "on"}">adjudicated &middot; ${esc(a.verdict)}${a.repaired ? " &middot; repaired" : ""}</span>`);
  }
  /* `meta.tools` is absent unless the gate opened, and that absence is the normal case —
     the gate declining is what keeps tool schemas away from the ~90% of turns that need
     none. So the chip only appears when something actually ran, rather than sitting there
     permanently reading "no tools" and training the eye to ignore it. */
  if (meta.tools) {
    const t = meta.tools;
    if (t.error) {
      chips.push(`<span class="chip warn">tools &middot; failed</span>`);
    } else if (t.calls && t.calls.length) {
      const failed = t.calls.some((c) => !c.ok);
      chips.push(`<span class="chip ${failed ? "warn" : "on"}">tools &middot; ${t.calls.map((c) => esc(c.name)).join(", ")}</span>`);
    } else {
      /* The gate allowed a family and the dispatcher declined to call anything. That is
         the design working — a cheap second opinion on an over-eager pattern match — so
         it is shown rather than hidden. */
      chips.push(`<span class="chip off">tools offered &middot; none used</span>`);
    }
  }

  const cites = (meta.retrieved && meta.retrieved.length)
    ? `<dl class="kv"><dt>sources</dt><dd>${meta.retrieved.map(esc).join("<br>")}</dd></dl>` : "";

  const toolRows = (meta.tools && meta.tools.calls && meta.tools.calls.length)
    ? `<dl class="kv"><dt>tools</dt><dd>${meta.tools.calls.map((c) =>
        `<span class="${c.ok ? "hi" : "bad"}">${esc(c.name)}</span> &middot; ${ms(c.ms)}`
      ).join("<br>")}</dd>
      <dt>dispatch</dt><dd>${esc((meta.tools.families || []).join(", ") || "—")} &middot; ${meta.tools.iterations || 0} round${meta.tools.iterations === 1 ? "" : "s"}</dd></dl>`
    : (meta.tools && meta.tools.error
        ? `<dl class="kv"><dt>tools</dt><dd class="bad">${esc(meta.tools.error)}</dd></dl>` : "");

  $("#trace").innerHTML = `
    <div class="rail">${rail}</div>
    <dl class="kv">
      <dt>route</dt><dd class="hi">${esc(meta.route)} &rarr; ${esc(meta.model || "?")}</dd>
      <dt>confidence</dt><dd>${meta.confidence != null ? meta.confidence.toFixed(2) : "—"}</dd>
      <dt>routing</dt><dd>${ms(meta.elapsed_ms)}</dd>
    </dl>
    <div class="why">${esc(meta.reason || "")}</div>
    <dl class="kv">
      <dt>effort</dt><dd class="hi">${esc(eff.level || "—")}</dd>
      <dt>budget</dt><dd>${eff.max_tokens != null ? eff.max_tokens + " tokens" : "—"}
        <div class="meter"><i style="width:${budgetPct}%"></i></div></dd>
    </dl>
    ${eff.why ? `<div class="why">${esc(eff.why)}</div>` : ""}
    <div class="chips">${chips.join("")}</div>
    ${toolRows}
    ${cites}`;
}

function selectMessage(idx, explicit = false) {
  openDrawer(explicit);
  document.querySelectorAll(".msg.bot").forEach((n) => n.classList.remove("selected"));
  const node = document.querySelector(`.msg.bot[data-idx="${idx}"]`);
  if (node) node.classList.add("selected");
  renderTrace(traces[idx], "turn " + (idx + 1));
}

/* ---------- rendering messages ---------- */

function addUser(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="who">you</div><div class="body">${esc(text)}</div>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* A failed turn is rolled out of `messages` so the next request doesn't carry a
   question that was never answered — but the bubble stays on screen, so it has to say
   so. Without this the visible transcript and the state silently disagree. */
function markUnsent(el) {
  if (!el) return;
  el.style.opacity = "0.5";
  const who = el.querySelector(".who");
  if (who) who.innerHTML = 'you &middot; <span style="color:var(--bad)">not sent</span>';
}

function addBot() {
  const idx = traces.length;
  traces.push(null);
  const el = document.createElement("div");
  el.className = "msg bot";
  el.dataset.idx = idx;
  el.innerHTML = `<div class="who">assistant</div>
    <div class="body"><span class="working"><span class="bars"><i></i><i></i><i></i><i></i></span>
    <span class="elapsed">routing</span></span></div>
    <div class="foot"></div>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;

  // A live timer, because the reasoning tier routinely takes 30–300 s. Without it a
  // working server is indistinguishable from a hung one, and that is the single most
  // important thing this console has to communicate.
  const started = performance.now();
  const tick = setInterval(() => {
    const s = el.querySelector(".elapsed");
    if (s) s.textContent = ((performance.now() - started) / 1000).toFixed(1) + "s";
  }, 100);

  return {
    idx, el,
    stopTimer: () => clearInterval(tick),
    setText(text) {
      const body = el.querySelector(".body");
      body.textContent = text;
      log.scrollTop = log.scrollHeight;
    },
    fail(msg) {
      clearInterval(tick);
      const body = el.querySelector(".body");
      body.classList.add("err");
      body.textContent = msg;
    },
    finish(meta, elapsed) {
      clearInterval(tick);
      traces[idx] = meta;
      const foot = el.querySelector(".foot");
      if (!meta) { foot.textContent = ""; return; }
      el.style.setProperty("--tier", `var(--route-${routeClass(meta.route)})`);
      const eff = meta.effort || {};
      foot.innerHTML =
        `<span class="tag ${routeClass(meta.route)}">${esc(meta.route)}</span>` +
        `<span>${esc(meta.model || "")}</span>` +
        `<span>&middot; ${esc(eff.level || "")}</span>` +
        `<span>&middot; ${(elapsed / 1000).toFixed(1)}s</span>` +
        (meta.grounded ? `<span>&middot; ${esc(meta.grounded)}</span>` : "") +
        (toolNames(meta) ? `<span class="chip tools">${esc(toolNames(meta))}</span>` : "") +
        (meta.remembered ? `<span class="chip remembered">remembered</span>` : "") +
        `<button type="button">trace</button>`;
      if (meta.remembered) refreshMemory();
      /* A note written by a tool is a memory the user should be able to see straight
         away, same as one captured by app/memory.py. */
      if (toolNames(meta).includes("write_note")) refreshMemory();
      foot.querySelector("button").onclick = () => selectMessage(idx, true);
      selectMessage(idx);
    },
  };
}

/* ---------- sending ---------- */

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;

  busy = true; sendBtn.disabled = true;
  input.value = ""; input.style.height = "auto";

  const userEl = addUser(text);
  messages.push({ role: "user", content: text });
  const bot = addBot();
  const started = performance.now();

  const body = { model: $("#model").value, messages, stream: true };
  const effort = $("#effort").value;
  if (effort !== "auto") body.effort = effort;

  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      let detail = `HTTP ${resp.status}`;
      try { detail = (await resp.json()).detail || detail; } catch {}
      bot.fail(detail);
      messages.pop();
      markUnsent(userEl);
      return;
    }

    // SSE. Note the server generates the whole reply up front when adjudication is
    // planned — an answer that might be replaced should not be streamed and then
    // retracted — so this may legitimately receive one large chunk rather than tokens.
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buffer = "", answer = "", meta = null;

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let chunk;
        try { chunk = JSON.parse(payload); } catch { continue; }
        if (chunk.error) { bot.fail(chunk.error.message || "upstream error"); return; }
        const delta = chunk.choices?.[0]?.delta || {};
        if (delta.content) { answer += delta.content; bot.setText(answer); }
        if (chunk.x_legend_route) meta = chunk.x_legend_route;
      }
    }

    if (!answer) bot.setText("(empty reply)");
    messages.push({ role: "assistant", content: answer });
    bot.finish(meta, performance.now() - started);
  } catch (err) {
    bot.fail(String(err && err.message ? err.message : err));
    messages.pop();
    markUnsent(userEl);
  } finally {
    bot.stopTimer();
    busy = false; sendBtn.disabled = false;
    input.focus();
    refreshHistory();
  }
}

/* ---------- route preview ---------- */

async function preview() {
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  $("#trace").innerHTML = '<p class="empty">Resolving…</p>';
  try {
    const meta = await (await fetch("/route/debug?prompt=" + encodeURIComponent(text))).json();
    renderTrace(meta, "preview");
    openDrawer(true);
  } catch (err) {
    $("#trace").innerHTML = `<p class="empty">Preview failed: ${esc(err.message)}</p>`;
  }
}

/* ---------- wiring ---------- */

sendBtn.onclick = send;
$("#preview").onclick = preview;

const aside = document.querySelector("aside");
const isDrawer = () => window.matchMedia("(max-width: 880px)").matches;

function setDrawer(open) {
  aside.classList.toggle("open", open);
  $("#scrim").classList.toggle("on", open);
}

$("#drawerToggle").onclick = () => setDrawer(!aside.classList.contains("open"));
$("#scrim").onclick = () => setDrawer(false);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setDrawer(false);
});

$("#memToggle").onclick = () => {
  memCollapsed = !memCollapsed;
  localStorage.setItem(MEM_KEY, memCollapsed ? "1" : "0");
  applyMemCollapsed();
  if (!memCollapsed) refreshMemory();
};

$("#histToggle").onclick = () => {
  histCollapsed = !histCollapsed;
  localStorage.setItem(HIST_KEY, histCollapsed ? "1" : "0");
  applyHistCollapsed();
  if (!histCollapsed) refreshHistory();  // it went stale while hidden
};
/* Docked, the trace is always on screen and this is inert. As a drawer it covers most of
   a phone, so it opens only when the trace was actually asked for — tapping "trace" or
   "preview route". Opening automatically after every reply would cover the answer the
   user is trying to read. */
const openDrawer = (explicit = false) => {
  if (!isDrawer() || explicit) setDrawer(true);
};
$("#reset").onclick = () => {
  messages = []; traces = [];
  log.innerHTML = "";
  $("#trace").innerHTML = '<p class="empty">New thread. Nothing decided yet.</p>';
  $("#traceWhen").textContent = "";
  input.focus();
};

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 190) + "px";
});

applyHistCollapsed();
applyMemCollapsed();
refreshMemory();
refreshStatus();
refreshHistory();
setInterval(refreshHistory, 8000);
input.focus();
</script>
</body>
</html>
