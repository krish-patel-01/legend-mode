# Evaluation cases.
#
# Run with: uv run python scripts/eval.py
#
# Every case here was observed at least once in real use — either it broke and was
# fixed, or it is a trap something else nearly fell into. Nothing is invented to pad a
# category out.
#
# Checks are deliberately declarative: substrings, numbers, regexes, route names. There
# is no "does this answer mean the same thing" check, because comparing prose to prose is
# exactly the unreliable step app/guardrails.py exists to avoid, and letting it in through
# the scorer would make every result questionable.
#
# `samples` matters. These models are stochastic and a single sample has repeatedly
# pointed the wrong way during development — the 350M answered "365 days in a leap year"
# once and "366" the next time. Cases that have been flaky get more samples; cases that
# are settled by a deterministic guardrail need only one.
#
# Fields:
#   id           unique, kebab-case
#   category     computable | reasoning | dispute | factual | persona | cheap |
#                effort | retrieval | tools
#   prompt       single-turn input
#   turns        multi-turn: a list of user messages; the real reply is fed back between
#                them, and checks apply to the last turn unless the turn says otherwise
#   samples      repetitions (default 1); the case scores as fraction passed
#   note         why this case exists, or why it is expected to fail
#   expect:
#     route        expected route; a list means "any of these"
#     not_route    route that must not be chosen
#     grounded     which guardrail must fire; `none` asserts that none did
#     contains     every string must appear (case-insensitive)
#     any_of       at least one string must appear
#     not_contains no string may appear
#     number       this number must appear (digits or the English word)
#     not_number   none of these numbers may appear
#     regex        reply must match
#     effort       expected effort level (fast | standard | careful); a list means any
#     max_tokens_below  the granted token budget must be under this
#     retrieved    true if corpus text must have been injected, false if it must not
#     tools        false asserts no tool ran; a name (or list) asserts which one did

cases:

  # --- computable: guardrails should make these deterministic ------------------------

  - id: leap-year-days
    category: computable
    prompt: "how many days in a leap year"
    samples: 2
    note: "350M answered 365 in one sample and 366 in another before guardrails."
    expect:
      grounded: calendar
      number: 366
      not_contains: ["365 days"]

  - id: timezone-ist
    category: computable
    prompt: "what time zone is IST"
    samples: 2
    note: "Answered 'Eastern Standard Time' and 'Central European Time' on separate runs."
    expect:
      grounded: timezone
      any_of: ["5:30", "5.30", "05:30"]
      not_contains: ["eastern standard", "central european"]

  - id: multiply-17-23
    category: computable
    prompt: "What is 17 * 23?"
    expect:
      grounded: arithmetic
      number: 391

  - id: multiply-unicode-times
    category: computable
    prompt: "calculate 17 × 23"
    expect:
      grounded: arithmetic
      number: 391

  - id: percent-of
    category: computable
    prompt: "how much is 15 percent of 240"
    expect:
      grounded: percent_of
      number: 36

  - id: percent-off-shirt
    category: computable
    prompt: "if a shirt is 40 dollars with 25% off, what do I pay in the end"
    samples: 2
    note: >
      Answered $20 before the discount guard existed, and overrode the grounded value
      on 5 of 6 samples before contradictions were corrected rather than only logged.
      10 is deliberately not in not_number: the correct claim names the discount
      amount ("...is exactly 30 (the discount itself is 10)").
    expect:
      grounded: percent_off
      number: 30
      not_number: [20, 15]

  - id: convert-km-miles
    category: computable
    prompt: "convert 10 km to miles"
    expect:
      grounded: unit_convert
      any_of: ["6.21", "6.2"]

  - id: convert-celsius
    category: computable
    prompt: "convert 100 c to f"
    expect:
      grounded: unit_convert
      number: 212

  - id: guard-declines-roman-numerals
    category: computable
    prompt: "what is 17 * 23 in roman numerals"
    note: "The guard cannot answer this, so it must decline rather than inject 391."
    expect:
      grounded: none

  # --- reasoning: must reach the 1.2B ------------------------------------------------

  - id: box-word-problem
    category: reasoning
    prompt: "How many boxes do I have if I have two boxes with one box inside each?"
    samples: 3
    note: "The original bug. Answered 2 on the trivial tier."
    expect:
      route: think
      grounded: none
      number: 4
      not_number: [2, 3]

  - id: apples-word-problem
    category: reasoning
    prompt: "I bought 3 apples and ate 1, how many am I left with"
    samples: 2
    expect:
      route: think
      number: 2

  - id: sqrt-two-irrational
    category: reasoning
    prompt: "prove that the square root of 2 is irrational"
    expect:
      route: think
      any_of: ["rational", "contradiction", "even", "p/q", "integers"]

  - id: code-fence-routes-to-think
    category: reasoning
    prompt: "find the bug:\n```\ndef f(n):\n    return f(n-1)\n```"
    expect:
      route: think

  - id: sequence-puzzle
    category: reasoning
    prompt: "Which word comes next: Stone, Often, Canine, _: A Helpful B Freight C Glow D Grape"
    samples: 2
    note: >
      Found in live testing. Reached the 350M via `fallback` — no reasoning keyword, no
      quantity, no code fence, and nothing close in the embedding bank. The answer is
      Freight: each word hides a number (stONE, ofTEN, caNINE, freEIGHT).
    expect:
      route: think

  - id: keyboard-transformation-puzzle
    category: reasoning
    prompt: "Given a QWERTY keyboard layout, if HEART goes to JRSTY, what does AFTER go to?"
    samples: 2
    note: >
      Also from live testing, where it answered "AFTER goes to G". Each letter shifts one
      key right, so the answer is SGYRT. Routing is what this case asserts; whether the
      1.2B actually solves it is a separate question.
    expect:
      route: think

  # The two cases above assert routing, which now works. These assert the *answers*, and
  # both fail: they mark a measured capability ceiling rather than a bug to chase.
  #
  # Measured on the 1.2B: at a 1536-token budget neither produced any answer (~135 s of
  # reasoning, then nothing). At 4096 the keyboard puzzle answered "S" after 215 s and the
  # sequence puzzle "A" after 342 s — both wrong. More budget bought a slower wrong
  # answer, so the budget stays where it is. A brevity instruction was tried too and was
  # ignored outright on these, though it did cut a solvable problem's tokens by 26%.
  #
  # `known_failing` keeps them out of routine runs, since each costs minutes to fail.
  # Run them with --include-known-failing when something might plausibly have moved.

  - id: sequence-puzzle-answer
    category: reasoning
    known_failing: true
    prompt: "Which word comes next: Stone, Often, Canine, _: A Helpful B Freight C Glow D Grape"
    note: "Each word hides a number: stONE, ofTEN, caNINE, frEIGHT. Answer: Freight (B)."
    expect:
      any_of: ["freight", " b", "(b)"]

  - id: keyboard-puzzle-answer
    category: reasoning
    known_failing: true
    prompt: "Given a QWERTY keyboard layout, if HEART goes to JRSTY, what does AFTER go to?"
    note: "Each letter shifts one key right: A->S, F->G, T->Y, E->R, R->T. Answer: SGYRT."
    expect:
      contains: ["sgyrt"]

  - id: monkeys-riddle-answer
    category: reasoning
    known_failing: true
    prompt: "Five monkeys are jumping around on a four poster bed while three chickens stand and watch. How many legs are on the floor?"
    note: >
      Answer is 10: the monkeys are on the bed so none of their legs are on the floor,
      three standing chickens give 6, and a four-poster bed has 4 legs of its own. The
      1.2B answers 26 (5x4 + 3x2), ignoring both the spatial constraint and the bed, and
      keeps answering 26 after being told the monkeys are on the bed. A multi-constraint
      lateral riddle, and a plausible ceiling rather than a routing fault.
    expect:
      number: 10
      not_number: [26]

  - id: puzzle-rule-does-not-eat-ordinary-questions
    category: cheap
    prompt: "what's wrong with this sentence"
    note: "'wrong' here is about the user's text, not a dispute of the previous answer."
    expect:
      not_route: think

  # --- dispute: the thread must not fall off the reasoning tier ----------------------

  - id: dispute-holds-answer
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "its incorrect"
    samples: 4
    note: "Measured 5 held / 1 caved / 2 vague over 8 turns after sticky routing."
    expect:
      route: think
      not_number: [2, 3]

  - id: dispute-repeated-nope
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "its incorrect"
      - "nope"
      - "nope"
    samples: 2
    note: "Turn 4 used to fall back to the 350M via the routing cache."
    expect:
      route: think
      not_number: [2, 3]

  - id: dispute-does-not-return-empty
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "nope"
    samples: 3
    note: >
      The 1.2B exhausted its budget and returned empty content on terse disputes.

      This case existed to catch exactly that and did not: `regex: "\w"` is satisfied by
      the honest-exhaustion message app/api.py substitutes, so the case scored 100% while
      failing at the thing it is named after. `real_answer` closes that. Expect this to
      show the residual rate rather than a clean 100% — the underlying limit is the
      model's, and it is better counted than hidden.
    expect:
      route: think
      real_answer: true
      regex: "\\w"

  - id: continuation-stays-on-tier
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "explain that"
    expect:
      route: think

  - id: dispute-phrased-as-a-sentence
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "No the answer is wrong"
    samples: 2
    note: >
      Found in live testing. The dispute pattern was anchored to the start of the
      message, so this matched nothing and the 350M replied "The answer is correct."
    expect:
      route: think
      not_number: [2, 3]

  - id: correction-supplying-a-missed-fact
    category: dispute
    turns:
      - "Five monkeys are jumping around on a four poster bed while three chickens stand and watch. How many legs are on the floor?"
      - "But the monkeys are on the bed"
    samples: 2
    note: >
      Found in live testing. The second turn matched no follow-up pattern, so no
      instruction was attached and the model repeated "26 legs." unchanged. This case
      asserts only that the turn is recognised and routed — whether the 1.2B then gets
      the riddle right is tracked separately as monkeys-riddle-answer.
    expect:
      route: think

  - id: bare-confusion-is-a-continuation
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "What?"
    note: "Used to route to the trivial tier, which just repeated the bare answer."
    expect:
      route: think

  - id: pleasantry-does-not-stick
    category: dispute
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "thanks!"
    note: "A thank-you must not cost a 28s reasoning pass."
    expect:
      not_route: think

  # --- cheap: must NOT be promoted to the 1.2B ---------------------------------------

  - id: greeting-is-trivial
    category: cheap
    prompt: "hi there"
    expect:
      route: trivial
      not_route: think

  - id: spell-a-word
    category: cheap
    prompt: "spell restaurant"
    expect:
      not_route: think
      contains: ["restaurant"]

  - id: capital-of-france
    category: cheap
    prompt: "what is the capital of France"
    expect:
      not_route: think
      contains: ["paris"]

  - id: rest-api-explanation
    category: cheap
    prompt: "explain what a REST API is in one line"
    note: "A fresh question starting with 'explain' must not be read as a continuation."
    expect:
      not_route: think
      any_of: ["http", "rest", "resource", "state"]

  - id: short-drafting-task
    category: cheap
    prompt: "give me two ideas for dinner"
    expect:
      not_route: think

  # --- persona: guards the regressions recorded in app/persona.py --------------------

  - id: no-prompt-echo-on-greeting
    category: persona
    prompt: "hi"
    samples: 3
    note: "A prompt ending on a quotable line made the 350M reply 'you don't have one yet.'"
    expect:
      not_contains:
        ["have no name", "don't have a name", "have one yet", "no company or product",
         "commercial assistant", "three sentences"]

  - id: no-prompt-echo-on-thanks
    category: persona
    prompt: "thanks!"
    samples: 3
    expect:
      not_contains:
        ["have no name", "have one yet", "no company or product", "three sentences"]

  - id: identity-question-routed-to-the-honest-tier
    category: persona
    samples: 4
    prompt: "who are you?"
    note: >
      This asserted `route: trivial` and was named "pinned", because Qwen3.5-0.8B insisted
      it was Qwen regardless of prompt while the 350M answered cleanly. Both halves
      expired: that tier is parked, and the 350M became the leaker. Measured interleaved,
      16 identity questions each — 350M 3/16 maker claims (one inventing OpenAI) against
      instruct 0/16. Sampled 4x because the leak is stochastic and 2 samples missed it.
    expect:
      route: chat
      not_contains: ["qwen", "tongyi", "alibaba", "openai", "anthropic", "liquid ai",
                     "stanford"]

  - id: denies-being-chatgpt
    category: persona
    prompt: "are you ChatGPT?"
    samples: 2
    note: "The word ChatGPT inside a correct denial is not a leak — check for the denial."
    expect:
      route: chat
      regex: "(?i)^\\s*(no|i'?m not|i am not)\\b|not chatgpt"

  - id: user-name-is-not-assistant-name
    category: persona
    prompt: "my name is Krish"
    samples: 2
    note: "Small tiers conflated the user's name with a question about their own."
    expect:
      not_contains: ["have no name", "my name is"]

  - id: recalls-user-name
    category: persona
    turns:
      - "my name is Krish"
      - "What is my name?"
    samples: 2
    expect:
      contains: ["krish"]

  # --- factual: expected to fail until retrieval exists (step 4) ---------------------
  #
  # These are counted, not fixed. The point of listing them is that the failures are
  # visible in every run instead of being rediscovered by accident later.

  - id: live-data-is-answered-from-a-tool
    category: tools
    prompt: "what's the weather in Mumbai right now"
    samples: 2
    note: >
      This case used to assert the opposite — that the reply admitted to having no live
      access — and its note read "No tools tier". That premise expired when the web family
      shipped, and the case then failed for the right reason: the assistant answered.
      A case describing a limitation has to be re-pointed when the limitation goes, or it
      starts defending the old behaviour.

      What has not changed is the thing worth checking: a live figure must come from the
      search, never from the model. `tools` asserts the call happened, so an answer
      recalled from training data fails here even when it reads plausibly.
    expect:
      tools: web_search
      not_contains: ["I don't have access", "no real-time"]

  # --- tools: the gate is the load-bearing part, so most of these assert it stays shut --

  - id: a-search-request-reaches-the-web
    category: tools
    prompt: "search how much the new spiderman movie had earned till now"
    note: >
      Verbatim from a live session where this reached no tool at all and was answered
      "I don't have real-time data" — one turn after the assistant agreed it had web
      access. The gate had been written alongside its own test phrasings and matched only
      those; an explicit search verb is now sufficient on its own.
    expect:
      tools: web_search

  - id: the-clock-is-read-not-recalled
    category: tools
    prompt: "what time is it in Tokyo"
    expect:
      tools: get_time

  - id: a-note-request-writes-a-note
    category: tools
    prompt: "make a note that the design review is on the 14th"
    expect:
      tools: write_note

  - id: ordinary-questions-never-see-a-tool
    category: tools
    prompt: "what is the capital of France"
    samples: 2
    note: >
      The most important tool case in the file, and it asserts that nothing happens.
      Measured with four tool definitions attached, this exact prompt came back "I'm
      sorry, but I can't provide that information" from a model that answers it correctly
      with none present. Offering tools gives these models a refusal posture, so the gate
      staying shut is what protects every turn that never needed one.
    expect:
      tools: false
      contains: ["Paris"]

  - id: creative-work-never-sees-a-tool
    category: tools
    prompt: "write me a haiku about winter"
    note: "With tools attached this produced a web_search call for the word 'winter'."
    expect:
      tools: false

  - id: explaining-a-tool-is-not-using-it
    category: tools
    prompt: "how does web search work"
    note: >
      Contains the word `search`, which is on its own enough to open the gate. Asking how
      a thing works is never a request to use it, which is what the discussion guard is
      for — this case exists because widening the gate to accept a bare "search" broke it.
    expect:
      tools: false

  - id: a-computed-answer-suppresses-tools
    category: tools
    prompt: "what is 17 * 23"
    note: >
      The arithmetic guardrail has already produced the exact answer, so a tool could only
      disagree with it. The gate is told to stay shut whenever grounding fired.
    expect:
      grounded: arithmetic
      tools: false
      number: 391

  - id: capital-of-australia
    category: factual
    prompt: "what is the capital of Australia"
    samples: 2
    note: >
      Sydney is the classic wrong answer here. `retrieved: false` is part of the case:
      the corpus is project documentation and its best chunk scores ~0.51 against a 0.66
      threshold, so nothing should be injected. Retrieving anyway is the -5.0 GPQA
      regression this design cites, and it would show up here first.
    expect:
      contains: ["canberra"]
      not_contains: ["sydney"]
      retrieved: false

  # --- effort: the controller's budgets and levels -----------------------------------

  - id: bare-denial-still-gets-a-real-answer
    category: effort
    turns:
      - "How many boxes do I have if I have two boxes with one box inside each?"
      - "nope"
    samples: 2
    note: >
      This case previously asserted `max_tokens_below: 512`, on the theory that a
      contentless denial deserves a small budget because the wanted reply is one short
      sentence. That was measured and it is wrong: a thinking model emits its reasoning
      block first, so a budget under the floor removes the answer rather than shortening
      it. At 384 tokens essentially every dispute turn returned the exhaustion message —
      strictly worse than the roughly 1 in 6 the small budget was meant to fix.

      Inverted deliberately, so it now fails if that starvation is ever reintroduced.
      `real_answer` is the load-bearing check: the exhaustion reply is well-formed prose
      with no forbidden number in it, so `regex` and `not_number` both wave it through,
      which is exactly how the regression scored as a clean run.
    expect:
      route: think
      max_tokens_at_least: 1024
      real_answer: true
      regex: "\\w"

  - id: greetings-cost-almost-nothing
    category: effort
    prompt: "hi there"
    note: "Latency is the thing that silently rots; this is the tripwire."
    expect:
      effort: fast
      max_tokens_below: 512

  - id: grounded-questions-are-fast
    category: effort
    prompt: "how much is 15 percent of 240"
    note: "A guard computed the answer; the model is only phrasing it."
    expect:
      effort: fast
      grounded: percent_of
      number: 36

  - id: a-correction-is-re-worked-not-starved
    category: effort
    turns:
      - "Five monkeys are jumping around on a four poster bed while three chickens stand and watch. How many legs are on the floor?"
      - "But the monkeys are on the bed"
    note: >
      A correction re-works the whole problem from the start with the new fact included,
      which is the most expensive of the three follow-up kinds — so it is the one least
      able to afford a trimmed budget. Previously asserted `max_tokens_below: 1536` for
      the same wrong reason as the case above.

      Whether the 1.2B then reaches 10 is tracked separately as `monkeys-riddle-answer`,
      which is `known_failing`. This case asserts only that the turn is recognised,
      routed, and answered rather than starved.
    expect:
      route: think
      effort: careful
      max_tokens_at_least: 1024
      real_answer: true

  # --- retrieval: questions only the local corpus can answer -------------------------
  #
  # The corpus is the project's own documentation (scripts/ingest.py, default sources
  # README.md and ROADMAP.md). That is a deliberate choice: nothing in it is knowledge
  # either model could hold parametrically, so these cases measure retrieval rather than
  # measuring whether the harness can read a file it was handed the answers in.

  - id: corpus-answers-a-project-question
    category: retrieval
    prompt: "which model verifies answers in this system?"
    samples: 2
    note: >
      Found in live testing. Answered by the 350M with the passage in front of it, the
      reply was "The model that verifies answers is LFM2.5-350M" — the exact inverse of
      the retrieved text. A retrieval hit now escalates to the reading tier.
    expect:
      retrieved: true
      any_of: ["1.2b", "1.2 b", "lfm2.5-1.2b"]

  - id: corpus-answers-a-how-do-i-question
    category: retrieval
    prompt: "how do I run the evals in this project?"
    samples: 2
    note: >
      `any_of` lists strings the model could only have got from the corpus. The original
      list named the script and the case file but not the flags, and a correct answer —
      "use `uv run` with options like `--routes-only`, `--save-baseline`" — scored as a
      miss. The flags are exactly as corpus-derived as the filenames, so this is an
      incomplete enumeration being completed, not a threshold being relaxed.
    expect:
      retrieved: true
      any_of: ["eval.py", "scripts/eval", "cases.yaml", "--routes-only",
               "--save-baseline", "evals/"]

  - id: arithmetic-never-retrieves
    category: retrieval
    prompt: "what is 17 * 23"
    note: "A computed answer is exact; a document can only muddy it."
    expect:
      retrieved: false
      grounded: arithmetic
      number: 391

  - id: creative-work-never-retrieves
    category: retrieval
    prompt: "give me two ideas for dinner"
    expect:
      retrieved: false
      not_route: think

  - id: obscure-date-fact
    category: factual
    prompt: "in what year was the Treaty of Westphalia signed"
    samples: 2
    note: "Expected to be unreliable at this scale. Retrieval is the fix, not prompting."
    expect:
      number: 1648
